name: parser-install

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare verified parser wheels
        run: |
          python tools/build_zipapp.py --output-dir "$RUNNER_TEMP/assets"
          python -m pip --isolated download --disable-pip-version-check \
            --only-binary=:all: --require-hashes --no-deps \
            --index-url https://pypi.org/simple \
            -r requirements-parsers.txt --dest "$RUNNER_TEMP/assets"
      - name: Verify the default installation and coding workflow
        run: python tools/check_parser_install.py --assets "$RUNNER_TEMP/assets"
