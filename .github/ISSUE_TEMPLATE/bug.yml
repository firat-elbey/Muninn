name: Bug report
description: Report reproducible behavior that differs from the documented behavior.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, personal memory data, or private ledger
        content. Report security issues through the private advisory link.
  - type: input
    id: version
    attributes:
      label: Muninn version
      description: Provide the release number or Git revision.
      placeholder: 0.1.0 or 0123456
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Provide the operating system and Python version.
      placeholder: macOS 15.6, Python 3.12.5
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the documented or expected result.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: State the result and include a scrubbed diagnostic if available.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: State any relevant configuration, limits, or attempted corrections.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, personal memory, and private ledger content.
          required: true
